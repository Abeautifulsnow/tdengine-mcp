[project]
name = "tdengine-mcp-server"
version = "0.1.0"
description = "A read-only TDengine MCP server for AI assistants"
readme = "README.md"
authors = [
    { email = "lcprunstone@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2",
    # MCP Python SDK v2（FastMCP 已更名为 MCPServer）
    "mcp[cli]>=2.3.0,<3",
    # 代码里显式 import dotenv，不依赖 mcp[cli] 的传递依赖
    "python-dotenv>=1.0.0",
    "taospy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped", "arg-type", "attr-defined", "type-arg", "valid-type", "union-attr", "call-arg", "annotation-unchecked", "typeddict-item"]

[[tool.mypy.overrides]]
module = "*"
disable_error_code = ["import-untyped", "arg-type", "attr-defined", "type-arg", "valid-type", "union-attr", "call-arg", "annotation-unchecked", "typeddict-item"]
ignore_missing_imports = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
tdengine-mcp-server = "tdengine_mcp_server:main"
